services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_ddd_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=laravel_ddd
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
    depends_on:
      - db
    networks:
      - laravel
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: laravel_ddd_db
    environment:
      MYSQL_DATABASE: laravel_ddd
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  # ← меняем здесь
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel_ddd_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"  # ← оставляем как есть или меняем на 8082
    depends_on:
      - db
    networks:
      - laravel

  redis:
    image: redis:alpine
    container_name: laravel_ddd_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
