apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: laravel-ddd-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: laravel-ddd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: laravel-ddd-service
                port:
                  number: 80
