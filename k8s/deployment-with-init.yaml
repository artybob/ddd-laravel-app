apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-ddd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel-ddd
  template:
    metadata:
      labels:
        app: laravel-ddd
    spec:
      initContainers:
        - name: copy-code
          image: laravel-ddd-app:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              cp -r /var/www/html/. /app
              chown -R www-data:www-data /app/storage /app/bootstrap/cache
              chmod -R 775 /app/storage /app/bootstrap/cache
          volumeMounts:
            - name: app-code
              mountPath: /app

      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: app-code
              mountPath: /var/www/html
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

        - name: php
          image: laravel-ddd-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: laravel-env
          env: []
          volumeMounts:
            - name: app-code
              mountPath: /var/www/html
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: app-code
          emptyDir: {}
